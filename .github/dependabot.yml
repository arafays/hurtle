version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      cargo: { patterns: ["*"], update-types: [minor, patch] }
  # Not covered: extension/ (web-ext, a dev-only lint tool). Its lockfile is
  # aube-lock.yaml, which Dependabot's npm ecosystem cannot read or update;
  # `aube update` by hand when needed. Cargo security advisories are checked by
  # `cargo deny` in CI (deny.toml) and by GitHub's Dependabot security alerts.
