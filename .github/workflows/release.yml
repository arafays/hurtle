name: Release

# Push a tag like v0.1.0 (it must match `version` in Cargo.toml) to build the
# Linux, Windows and macOS packages plus the browser extension, and publish
# them as a GitHub release with SHA256SUMS. Run it by hand (Actions > Release >
# Run workflow) for a dry run: everything is built and collected as workflow
# artifacts, nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-published release

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  MISE_LOCKED: 1

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Tag matches Cargo.toml version
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag=$GITHUB_REF_NAME; fi
          echo "version=$(scripts/check-version.sh "$tag")" >> "$GITHUB_OUTPUT"

  # Tests, clippy, cargo-deny and the extension checks must pass (CI is reusable)
  # before anything is built or published.
  verify:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      skip-e2e: true

  build:
    name: ${{ matrix.target }}
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          # Native arm64 runner: no cross toolchain needed.
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux build dependencies (GPUI)
        if: runner.os == 'Linux'
        run: sudo scripts/ci-linux-deps.sh
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}
          # Tags only restore. A manual dry run from main refreshes the cache.
          save-if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo build --release --locked --target ${{ matrix.target }} -p hurtle-app -p hurtle-host -p hurtle-cli
      - run: scripts/package.sh ${{ matrix.target }}
      - name: Debian package
        if: runner.os == 'Linux'
        run: scripts/package-deb.sh ${{ matrix.target }}
      # Inno Setup 6 is on the hosted Windows images; install a pinned one if not.
      - name: Windows installer
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: "*" # keep Git Bash from rewriting iscc's /D switches
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [[ ! -x $iscc ]]; then
            choco install innosetup --version 6.7.1 -y --no-progress
          fi
          "$iscc" "/DVersion=$(scripts/check-version.sh)" \
            "/DSrcDir=$(cygpath -w "$PWD/target/${{ matrix.target }}/release")" \
            "/DOutDir=$(cygpath -w "$PWD/dist")" packaging/windows/hurtle.iss
          ls -l dist
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: scripts/package-dmg.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hurtle-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  extension:
    name: Browser extension
    needs: [prepare, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      MISE_DISABLE_TOOLS: rust # `mise run` would otherwise install Rust too
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node aube
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/aube/store
          key: aube-store-${{ runner.os }}-${{ hashFiles('extension/aube-lock.yaml') }}
          restore-keys: aube-store-${{ runner.os }}-
      - run: mise run ext:lint # builds extension/dist/{chrome,firefox} + zips first
      - name: Collect zips
        run: mkdir -p dist && cp extension/dist/*.zip extension/dist/*-unsigned.xpi dist/
      # Firefox only installs signed add-ons permanently. With AMO API keys
      # (https://addons.mozilla.org/developers/addon/api/key/) set as the
      # AMO_JWT_ISSUER / AMO_JWT_SECRET secrets, sign it as an unlisted
      # (self-distributed) add-on; without them the unsigned xpi still ships.
      - name: Sign Firefox add-on
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.prepare.outputs.version }}
        if: env.AMO_JWT_ISSUER != ''
        run: |
          mise run ext:sign
          for f in extension/dist/signed/*.xpi; do mv "$f" "dist/hurtle-firefox-$VERSION.xpi"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hurtle-extension
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Checksums + release
    needs: [prepare, build, extension]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          retention-days: 14
      # Scoop, winget and Homebrew cask manifests with this release's hashes.
      # Kept out of dist/ (and so out of the release): submit them by hand or
      # from a job with the right credentials.
      - name: Render package-manager manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/update-manifests.sh "$VERSION" dist/SHA256SUMS.txt manifests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manifests
          path: manifests
          retention-days: 30
      # The notes point Firefox users at the signed xpi; without AMO secrets only
      # the unsigned one ships, so say that instead of linking a missing file.
      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp .github/release-notes.md "$RUNNER_TEMP/notes.md"
          if [[ ! -f dist/hurtle-firefox-$VERSION.xpi ]]; then
            echo "::warning::no signed Firefox xpi (AMO secrets unset?); notes point at the unsigned one"
            sed -i "/^- Firefox, Zen, LibreWolf:/c\\- Firefox, Zen, LibreWolf: this release has no Mozilla-signed add-on. Load \`hurtle-firefox-$VERSION-unsigned.xpi\` as a temporary add-on (\`about:debugging\` → *Load Temporary Add-on*), or use Developer/Nightly with signing disabled." "$RUNNER_TEMP/notes.md"
          fi
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  # Installed copies of the unlisted Firefox add-on update themselves from
  # docs/updates.json (the manifest's `update_url`, on GitHub Pages). Once the
  # release is up, list its signed xpi there and push that to main.
  firefox-update:
    name: Firefox update manifest
    needs: [prepare, publish]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write # push docs/updates.json
      pages: write # rebuild Pages
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hurtle-extension
          path: ext
      - name: Update docs/updates.json
        run: |
          xpi="ext/hurtle-firefox-$VERSION.xpi"
          if [[ ! -f $xpi ]]; then
            echo "::warning::no signed xpi (AMO secrets unset?); update manifest left alone"
            exit 0
          fi
          scripts/firefox-update.sh "$VERSION" "$xpi"
          if git diff --quiet docs/updates.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Firefox update manifest: $VERSION" docs/updates.json
          git pull --rebase origin main # main may have moved since checkout
          git push origin HEAD:main
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null || true
