# Tooling: mise (https://mise.jdx.dev) pins the toolchain, aube (https://aube.sh)
# manages the extension's JS dev dependencies. Everything runs as `mise run <task>`.

min_version = "2026.11.4"

[settings]
# Fail rather than resolve a tool that mise.lock doesn't pin (CI sets MISE_LOCKED=1 too).
lockfile = true

[tools]
rust = { version = "1.99", components = "rustfmt,clippy" }
node = "26"
aube = { version = "2", minimum_release_age = "0s" }
shellcheck = "0.11"
actionlint = "1.7"

[env]
# Keep dev runs out of your real download list/settings.
HURTLE_DATA = "{{config_root}}/.dev-data"
# The window manager can tell dev/test windows apart (see CLAUDE.md).
HURTLE_APP_ID = "hurtle-dev"

[tasks.dev]
description = "Run the desktop app (debug build) with dev data"
run = "cargo run -p hurtle-app --bin hurtle -- {{arg(name='url', default='')}}"

[tasks.build]
description = "Release build of app, native host and CLI"
run = "cargo build --release -p hurtle-app -p hurtle-host -p hurtle-cli"

[tasks.test]
description = "Engine unit tests"
run = "cargo test -p hurtle-core"

[tasks.lint]
description = "clippy + extension lint"
depends = ["ext:lint"]
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "cargo fmt --check"
run = "cargo fmt --all --check"

[tasks."ci:rust"]
description = "What CI runs per OS: clippy -D warnings + engine tests (locked)"
run = [
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test -p hurtle-core --locked",
]

[tasks."check:cross"]
description = "Type-check Windows (all crates) and macOS (core/host/cli) from Linux with zig as C compiler"
tools = { zig = "0.17" }
run = "scripts/cross-check.sh"

[tasks.serve]
description = "Throttled test server: serve FILE at N KiB/s per connection (default 512)"
run = "cargo run --release -p hurtle-core --example throttle_server -- {{arg(name='file')}} 8090 {{arg(name='kbps', default='512')}}"

[tasks.bench]
description = "Download from the throttle server with 1 then 8 connections (needs `mise run serve` running)"
run = """
#!/usr/bin/env bash
set -euo pipefail
out=$(mktemp -d)
cargo build -q --release -p hurtle-cli
for c in 1 8; do
  ./target/release/hurtle-cli http://127.0.0.1:8090/bench -c $c -o "$out" 2>&1 | tr '\\r' '\\n' | tail -1
  rm -f "$out"/*
done
rmdir "$out"
"""

[tasks."ext:build"]
description = "Build extension/dist/{chrome,firefox} + zips"
run = "extension/build.sh"

[tasks."ext:deps"]
description = "Install the extension's JS dev dependencies (web-ext)"
dir = "extension"
run = "aube install"

[tasks."ext:lint"]
description = "Lint the Firefox build with web-ext (self-hosted: it has an update_url)"
depends = ["ext:build", "ext:deps"]
dir = "extension"
run = "aube exec web-ext lint --self-hosted --source-dir dist/firefox"

[tasks."ext:sign"]
description = "Sign the Firefox add-on as unlisted (needs AMO_JWT_ISSUER / AMO_JWT_SECRET)"
depends = ["ext:deps"]
dir = "extension"
run = "aube exec web-ext sign --channel unlisted --source-dir dist/firefox --artifacts-dir dist/signed --api-key \"$AMO_JWT_ISSUER\" --api-secret \"$AMO_JWT_SECRET\""

[tasks."ext:submit"]
description = "Upload the Firefox add-on to AMO for unlisted signing without waiting for approval"
depends = ["ext:deps"]
dir = "extension"
run = "aube exec web-ext sign --channel unlisted --approval-timeout 0 --source-dir dist/firefox --artifacts-dir dist/signed --api-key \"$AMO_JWT_ISSUER\" --api-secret \"$AMO_JWT_SECRET\""

[tasks."ext:fetch-signed"]
description = "Download the signed xpi from AMO once approved (exit 2 while pending); [version]"
run = "scripts/amo-signed.py"

[tasks."ci:shellcheck"]
description = "shellcheck every script"
run = "shellcheck scripts/*.sh extension/build.sh docs/install.sh packaging/linux/install.sh"

[tasks.package]
description = "Release build for this machine + dist/ archive (what CI publishes)"
run = """
#!/usr/bin/env bash
set -euo pipefail
target=$(rustc -vV | sed -n 's/^host: //p')
cargo build --release --locked --target "$target" -p hurtle-app -p hurtle-host -p hurtle-cli
scripts/package.sh "$target"
"""

[tasks."package:deb"]
description = "Build dist/hurtle_<ver>_<arch>.deb for this machine (after `mise run package`)"
run = """
#!/usr/bin/env bash
set -euo pipefail
scripts/package-deb.sh "$(rustc -vV | sed -n 's/^host: //p')"
"""

[tasks."package:dmg"]
description = "Build the .dmg from the macOS zip (macOS only, after `mise run package`)"
run = """
#!/usr/bin/env bash
set -euo pipefail
scripts/package-dmg.sh "$(rustc -vV | sed -n 's/^host: //p')"
"""

[tasks.manifests]
description = "Fill the scoop/winget/Homebrew manifests: mise run manifests <version> [dist/SHA256SUMS.txt]"
run = "scripts/update-manifests.sh {{arg(name='version')}} {{arg(name='sums', default='dist/SHA256SUMS.txt')}}"

[tasks."ci:lint"]
description = "Lint the GitHub workflows"
run = "actionlint"

[tasks."ci:deny"]
description = "cargo-deny: advisories, licenses, bans, sources (see deny.toml)"
tools = { "aqua:EmbarkStudios/cargo-deny" = "0.20" }
run = "cargo deny --locked check"

[tasks."ext:e2e"]
description = "Headless Chromium end-to-end test of extension + host + app"
depends = ["ext:build"]
run = "cargo build -p hurtle-app -p hurtle-host -p hurtle-core --example seed && node extension/test/e2e.mjs"

[tasks."ext:e2e-firefox"]
description = "Headless Firefox/Zen test of the dialog (uses the installed host; HURTLE_FIREFOX=zen-bin, HURTLE_VIDEO=<real page>)"
depends = ["ext:build"]
run = "node extension/test/e2e-firefox.mjs"

[tasks.install]
description = "Install binaries, desktop entry and native-messaging host for this user"
run = "scripts/install.sh"

[tasks.uninstall]
run = "scripts/install.sh --uninstall"
