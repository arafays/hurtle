[workspace]
resolver = "3"
members = ["crates/hurtle-core", "crates/hurtle-cli", "crates/hurtle-app", "crates/hurtle-host"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
hurtle-core = { path = "crates/hurtle-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "signal", "rt-multi-thread", "macros", "fs", "net", "io-util", "time", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
# Backtraces keep file:line, but the target dir (and CI cache) stays much smaller.
debug = "line-tables-only"
