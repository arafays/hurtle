[workspace]
resolver = "3"
members = ["crates/surge-core", "crates/surge-cli", "crates/surge-app", "crates/surge-host"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
surge-core = { path = "crates/surge-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "signal", "rt-multi-thread", "macros", "fs", "net", "io-util", "time", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
dirs = "6"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
# Backtraces keep file:line, but the target dir (and CI cache) stays much smaller.
debug = "line-tables-only"
