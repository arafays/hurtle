[package]
name = "surge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-connection, segmented HTTP download engine"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
dirs.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "system-proxy", "blocking"] }
percent-encoding = "2"
sha2 = { version = "0.10", default-features = false }
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
